<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Flow Man</title>
    <meta
      name="description"
      content="Portfolio for One Flow Man and Treestyle Studios — games, music, and more."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Press+Start+2P&family=Source+Sans+3:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-brand="primary">
    <div class="bg-stage" id="bg-stage" aria-hidden="true">
      <div class="bg-veil"></div>
      <div class="rgb-split" id="rgb-split"></div>
      <div class="bg-noise" id="bg-noise"></div>
    </div>

    <div class="site">
      <header class="topbar">
        <nav class="socials" id="socials" aria-label="Social links"></nav>
      </header>

      <main class="hero">
        <div class="hero-panel">
          <div class="brand">
            <h1 class="brand-mark">
              One <span class="flow">Flow</span> Man
            </h1>
            <p class="brand-secondary">Treestyle Studios</p>
          </div>
          <p class="tagline">Games, music, and whatever else makes it through the noise.</p>
          <nav class="nav" aria-label="Portfolio sections">
            <button type="button" data-modal="about">About</button>
            <button type="button" data-modal="games">Games</button>
            <button type="button" data-modal="music">Music</button>
            <a href="mailto:will@oneflowman.com">Contact</a>
          </nav>
        </div>
      </main>

      <footer class="footer">One Flow Man · Treestyle Studios</footer>
    </div>

    <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-backdrop" id="modal-backdrop"></div>
      <div class="modal-panel" id="modal-panel" data-kind="">
        <div class="modal-fx" aria-hidden="true">
          <div class="modal-scanlines"></div>
          <div class="modal-grain"></div>
          <p class="modal-ghost" id="modal-ghost">GAMES</p>
        </div>

        <button type="button" class="modal-close" id="modal-close" aria-label="Close">
          <span>Bail</span>
        </button>

        <header class="modal-header">
          <div class="modal-heading">
            <p class="modal-stamp" id="modal-stamp">// SIGNAL</p>
            <h2 class="modal-title" id="modal-title">Portfolio</h2>
            <p class="modal-meta" id="modal-meta" hidden></p>
          </div>
        </header>

        <p class="modal-hint" id="modal-hint" hidden>drag / scroll →</p>

        <div class="modal-body" id="modal-body"></div>

        <div class="modal-scrub" id="modal-scrub" hidden>
          <div class="modal-scrub-track">
            <div class="modal-scrub-thumb" id="modal-scrub-thumb"></div>
          </div>
          <span class="modal-scrub-label" id="modal-scrub-label">00</span>
        </div>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
